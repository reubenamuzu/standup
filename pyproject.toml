[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "standup-cli"
version = "0.1.0"
description = "Generate standup and changelog reports from your git history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Reuben Korsi Amuzu", email = "reubenamuzu23@gmail.com" }]
keywords = ["git", "standup", "changelog", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/reubenamuzu/standup"
Repository = "https://github.com/reubenamuzu/standup"

[project.scripts]
standup = "standup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/standup"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
